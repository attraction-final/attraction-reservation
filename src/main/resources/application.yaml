spring:
  application:
    name: attraction-reservation

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/attraction_reservation}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 600000
  refresh-token-expiration: 604800000