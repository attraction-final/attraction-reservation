name: CI

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # PR 코멘트
  checks: write          # 테스트 결과 Check Run 생성

jobs:
  test-and-coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube: 신규 코드 판별 / blame 정보에 전체 히스토리 필요

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1) 테스트 + JaCoCo 리포트
      - name: Run tests & generate JaCoCo report
        run: ./gradlew test jacocoTestReport --no-daemon

      # 2) 테스트 결과를 PR Checks 탭 / 요약에 표시 (실패한 테스트 바로 확인)
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_name: 'JUnit Test Report'
          detailed_summary: true
          include_passed: false
          require_tests: true

      #      # 3) 커버리지 80% 미만이면 실패
      #      - name: Verify coverage (min 80%)
      #        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      # 4) SonarQube 분석
      #    - PR: 스캔 결과만 업로드하고 바로 종료 (Quality Gate는 SonarCloud가 PR Check/코멘트로 표시)
      #    - push(main): Quality Gate 결과까지 대기 → 아래 summary에서 최신 결과 조회
      #    포크 PR에는 secrets가 전달되지 않으므로 같은 레포에서 온 PR / push만 실행
      - name: SonarQube analysis
        id: sonar
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=${{ github.event_name == 'push' }} --no-daemon

      # 5) push 시 SonarQube 결과를 GitHub Actions Job Summary에 표시
      - name: SonarQube summary
        if: always() && github.event_name == 'push' && steps.sonar.outcome != 'skipped'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          BRANCH: ${{ github.ref_name }}
        run: |
          API="https://sonarcloud.io/api"
          QS="projectKey=${SONAR_PROJECT_KEY}&branch=${BRANCH}"
          MS="component=${SONAR_PROJECT_KEY}&branch=${BRANCH}&metricKeys=coverage,bugs,vulnerabilities,security_hotspots,code_smells,duplicated_lines_density"

          QG=$(curl -sf -u "${SONAR_TOKEN}:" "${API}/qualitygates/project_status?${QS}") || QG='{}'
          M=$(curl -sf -u "${SONAR_TOKEN}:" "${API}/measures/component?${MS}") || M='{}'

          STATUS=$(echo "$QG" | jq -r '.projectStatus.status // "UNKNOWN"')
          case "$STATUS" in
            OK)    ICON="✅ Passed" ;;
            ERROR) ICON="❌ Failed" ;;
            NONE)  ICON="⚪ Not computed (첫 분석 이후 계산됨)" ;;
            *)     ICON="⚪ ${STATUS}" ;;
          esac

          m() { v=$(echo "$M" | jq -r --arg k "$1" '(.component.measures // [])[] | select(.metric==$k) | .value'); echo "${v:--}"; }

          {
            echo "## 🔍 SonarQube Cloud 분석 결과 (\`${BRANCH}\`)"
            echo ""
            echo "**Quality Gate:** ${ICON}"
            echo ""
            FAILED=$(echo "$QG" | jq -r '(.projectStatus.conditions // [])[] | select(.status=="ERROR") | "- `\(.metricKey)`: \(.actualValue) (기준 \(.comparator) \(.errorThreshold))"')
            if [ -n "$FAILED" ]; then echo "**실패한 조건**"; echo ""; echo "$FAILED"; echo ""; fi
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Coverage | $(m coverage)% |"
            echo "| Bugs | $(m bugs) |"
            echo "| Vulnerabilities | $(m vulnerabilities) |"
            echo "| Security Hotspots | $(m security_hotspots) |"
            echo "| Code Smells | $(m code_smells) |"
            echo "| Duplications | $(m duplicated_lines_density)% |"
            echo ""
            echo "[SonarQube Cloud에서 자세히 보기](https://sonarcloud.io/summary/overall?id=${SONAR_PROJECT_KEY}&branch=${BRANCH})"
          } >> "$GITHUB_STEP_SUMMARY"

      # 6) 리포트 Artifact 저장 (성공/실패 무관)
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 14