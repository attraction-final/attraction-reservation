spring:
  application:
    name: attraction-reservation

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/attraction_reservation}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 비관적 락 대기 타임아웃 3초 (MySQL은 jakarta.persistence.lock.timeout 힌트를 무시함)
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3


  # 스키마는 Flyway 마이그레이션(db/migration)으로만 바꾸고, Hibernate는 엔티티와 일치하는지 검증만 한다.
  # 작성 방법은 docs/database/migration.md
  flyway:
    # Flyway 도입 전에 테이블을 만들어 둔 DB(운영, Hibernate로 만든 로컬 DB)는
    # V1(초기 스키마)이 적용된 것으로 표시하고 V2부터 적용한다. 빈 DB는 V1부터 적용한다.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  task:
    scheduling:
      pool:
        size: 3   # 웹훅·보상·환불 스케줄러가 서로의 PG 지연에 밀리지 않도록 스레드를 나눈다

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Jev 질문 분류. api-key는 여기 적지 않고 환경변수 SPRING_AI_TYPESAFE_APIKEY로만 주입한다.
  # 키가 없으면 앱은 뜨고 Q&A만 503으로 응답한다. 값을 비우거나 ${...}로 적으면 기동에 실패한다.
  ai:
    typesafe:
      model: "jev-1.13.0"
      timeout: 2s
      retry:
        max-retries: 1
        total-timeout: 5s

# 로그 한 줄을 logfmt로 출력한다. 규칙은 docs/logging/logging.md 참고
# 모든 프로필에서 같은 패턴을 쓴다.
logging:
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level logger=%logger{36} thread=%thread traceId=%X{traceId:-} %msg%n"

# Prometheus 수집과 로드밸런서 헬스 체크에 필요한 엔드포인트만 노출한다.
# 관리 포트 분리와 probe 설정은 운영 전용이라 application-prod.yml에 둔다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    # Grafana에서 HTTP 응답 시간 p95·p99를 계산할 수 있도록 histogram 버킷을 내보낸다.
    # 버킷 범위를 5ms~10s로 좁혀 시계열 수를 줄인다.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 600000
  refresh-token-expiration: 604800000

# secret 값은 환경변수로만 주입한다.
portone:
  base-url: ${PORTONE_BASE_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}

payment:
  webhook:
    scheduler:
      enabled: true
      fixed-delay: 10s   # 이전 실행이 끝난 뒤 다음 실행까지 대기 시간
      batch-size: 50     # 한 번에 처리할 최대 웹훅 수
  compensation:
    scheduler:
      enabled: true
      fixed-delay: 30s   # 재시도 백오프가 1분부터라 웹훅보다 길게 둔다
      batch-size: 20     # 한 번에 처리할 최대 보상 요청 수
      pg-check-batch-size: 5   # 한 번에 확인할 최대 PG_PENDING 수 (확인마다 PG 조회)
  refund:
    scheduler:
      enabled: true
      fixed-delay: 30s   # 재시도 백오프가 1분부터라 웹훅보다 길게 둔다
      batch-size: 20     # 한 번에 처리할 최대 환불 수
      pg-check-batch-size: 5   # 한 번에 확인할 최대 PG_PENDING 수 (확인마다 PG 조회)

ticket:
  expiration:
    scheduler:
      batch-size: 100
      fixed-delay: 1m

# 슬롯 자동 생성 (서버 시작 시 + 매일 00:05 KST)
# 오늘부터 days-ahead 일 중 "슬롯이 하나도 없는 날"만 채운다. 서버 1대 기준.
attraction:
  slot:
    generation:
      days-ahead: 30             # 주문 가능한 방문일(오늘 ~ 30일)과 맞춘다
      first-start-time: "10:00"  # 따옴표 필수: 없으면 YAML 이 숫자(600)로 읽을 수 있다
      last-start-time: "21:30"
      interval-minutes: 30       # 탑승 시간이 더 길면 탑승 시간만큼 띄운다
      capacity: 20
      scheduler:
        enabled: true
        cron: "0 5 0 * * *"      # 초 분 시 일 월 요일 → 매일 00:05