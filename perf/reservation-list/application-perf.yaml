# 전용 Compose에서만 사용한다. 실서비스 비밀 값/외부 PG에 접근하지 않는다.
server:
  address: 0.0.0.0
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/reservation_perf
    username: perf
    password: perf-local-only
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
jwt:
  secret: cGVyZi1sb2NhbC1vbmx5LWtleS1kb250LXVzZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
portone:
  base-url: http://127.0.0.1:9
  api-secret: local-test-only
  store-id: local-test-only
  channel-key: local-test-only
  webhook-secret: bG9jYWwtdGVzdC1vbmx5
app:
  oauth2:
    success-redirect-uri: http://localhost:18096/unused
    failure-redirect-uri: http://localhost:18096/unused
order:
  cancel:
    scheduler:
      enabled: false
payment:
  webhook:
    scheduler:
      enabled: false
  compensation:
    scheduler:
      enabled: false
  refund:
    scheduler:
      enabled: false
ticket:
  expiration:
    scheduler:
      enabled: false
attraction:
  slot:
    generation:
      scheduler:
        enabled: false
management:
  server:
    address: 0.0.0.0
    port: 8081
