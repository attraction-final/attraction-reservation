# 운영 인스턴스에서 애플리케이션과 로그 수집기(Alloy)를 함께 실행한다.
# CD가 이 디렉터리를 S3의 <커밋 SHA>/ 아래에 올리고, 인스턴스는 기동 시 받아서 실행한다.
#
# 인스턴스가 준비할 값 (user-data)
#   .env       APP_IMAGE, APP_VERSION, APP_ENV, LOKI_URL, PROMETHEUS_URL, INSTANCE_ID   compose 변수 치환용
#   app.env    DB_URL, JWT_SECRET 등 애플리케이션 환경변수  Parameter Store에서 읽어 만든다. 이미지에 넣지 않는다.
#
#   docker compose up -d

name: attraction-reservation

services:
  app:
    image: ${APP_IMAGE:?}:${APP_VERSION:?}
    restart: unless-stopped
    env_file:
      - path: app.env
        format: raw   # SSM 값의 $, # 를 Compose가 해석하지 않는다 (Compose 2.30+)
    environment:
      SPRING_PROFILES_ACTIVE: prod   # application-prod.yml 적용
    # JVM 옵션은 Dockerfile의 ENTRYPOINT에 둔다.
    # JAVA_TOOL_OPTIONS는 logfmt가 아닌 "Picked up ..." 줄을 컨테이너 로그에 남기므로 쓰지 않는다.
    mem_limit: 1200m
    ports:
      - "8080:8080"   # 서비스
      - "8081:8081"   # actuator: 보안 그룹에서 로드밸런서·Prometheus에만 연다
    # 진행 중인 요청과 스케줄러 작업이 끝날 시간을 준다.
    stop_grace_period: 30s
    # Alloy가 Docker API로 stdout을 읽는다. 디스크가 차지 않게 로그 파일을 순환한다.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.21.3
    mem_limit: 256m
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      APP_ENV: ${APP_ENV:?}
      LOKI_URL: ${LOKI_URL:?}
      PROMETHEUS_URL: ${PROMETHEUS_URL:?}
      INSTANCE_ID: ${INSTANCE_ID:?}   # 로그·메트릭의 instance 레이블
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 재시작해도 어디까지 읽었는지(position)를 이어서 쓴다.
      - alloy-data:/var/lib/alloy/data
    # default: app 메트릭 수집과 Loki·Prometheus 전송, docker-api: docker-proxy 접근
    networks:
      - default
      - docker-api
    depends_on:
      - docker-proxy

  # Alloy가 Docker 소켓을 직접 마운트하지 않도록 Docker API를 읽기 전용으로 중계한다.
  # 소켓은 :ro로 마운트해도 API 쓰기(컨테이너 생성 등)를 막지 못한다.
  # POST는 기본값(0)으로 막아 모든 요청을 조회(GET·HEAD)로 제한한다. (EVENTS·PING·VERSION은 기본 허용)
  # 남는 위험: 허용한 조회로 다른 컨테이너의 설정(환경변수 포함)은 읽을 수 있다.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    mem_limit: 64m
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # 컨테이너 목록·상세·로그 (discovery.docker, loki.source.docker)
      NETWORKS: 1     # 네트워크 조회 (discovery.docker가 네트워크 레이블을 만들 때 쓴다)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # 포트를 공개하지 않고, 외부로 나가는 길이 없는 내부 네트워크에만 둔다.
    networks:
      - docker-api

networks:
  docker-api:
    internal: true

volumes:
  alloy-data:
