name: CD

# main에 push된 커밋의 CI가 성공하면 운영에 배포한다.
# 바뀐 파일에 따라 앱(ASG)과 모니터링 인스턴스 중 필요한 쪽만 배포한다.
# 롤백은 workflow_dispatch로 이전 커밋 SHA를 넣어 실행한다. (앱만 배포한다)
#   수동 롤백은 긴급 조치다. 다음 main push의 CD는 롤백한 버전부터 비교하므로 문제 커밋도 다시 배포한다.
#   다음 push 전에 main에서 문제 커밋을 revert한다.
#
# workflow_run은 기본 브랜치(dev)에 있는 이 파일로 실행된다. 수동 실행은 main에 있는 파일로 실행된다.
# 이 파일의 변경은 dev에 머지되는 순간 자동 배포에 적용되므로, main에 있는 코드와 함께 동작하는지 확인한다.
#
# 배포 대상 결정 (changes)
#   운영에 마지막으로 반영한 버전(APP_VERSION, MONITORING_VERSION)과 이번 커밋을 비교한다.
#   - 앱: deploy/monitoring/, docs/, .github/, *.md 밖의 파일이 바뀌었으면 배포한다.
#   - 모니터링: deploy/monitoring/ 이 바뀌었으면 배포한다.
#   마지막 반영 버전을 모르거나 이번 커밋의 조상이 아니면 변경이 있다고 본다.
#
# 앱 배포 흐름 (deploy-app)
#   1. 이미지를 linux/arm64로 빌드해 ECR에 <커밋 SHA> 태그로 올리고, 실행 구성(deploy/, monitoring/ 제외)을
#      S3의 <커밋 SHA>/ 아래에 올린다. 운영 인스턴스가 Graviton(t4g)이므로 ARM 러너에서 빌드한다.
#      (이미 있으면 건너뛴다)
#   2. Parameter Store의 APP_VERSION을 이번 SHA로 바꾼다.
#   3. ASG Instance Refresh를 시작한다. 새 인스턴스는 기동 시 APP_VERSION의 실행 구성을 받아
#      docker compose로 애플리케이션과 Alloy를 실행한다.
#   4. 교체가 실패하거나 시간 안에 끝나지 않으면 APP_VERSION을 이전 값으로 되돌리고 다시 교체한다.
#
# 모니터링 배포 흐름 (deploy-monitoring)
#   1. deploy/monitoring/ 을 S3의 monitoring/<커밋 SHA>/ 아래에 올린다.
#   2. Parameter Store의 MONITORING_VERSION을 이번 SHA로 바꾼다.
#   3. SSM Run Command로 모니터링 인스턴스가 새 구성을 받아 docker compose up -d 하고
#      설정 파일을 다시 읽도록 Prometheus, Loki, Grafana를 재시작한다.
#   4. 실패하면 MONITORING_VERSION을 이전 값으로 되돌린다. (다음 배포에서 같은 변경을 다시 반영한다)
#      인스턴스에 받은 설정은 되돌리지 않으므로, 다음 배포 전까지 일부만 바뀐 설정으로 동작할 수 있다.
#
# GitHub Environment(production)에 필요한 설정
#   vars.AWS_REGION            예: ap-northeast-2
#   vars.AWS_DEPLOY_ROLE_ARN   GitHub OIDC로 맡을 배포 역할
#   vars.ECR_REPOSITORY        이미지를 올릴 ECR 저장소 이름
#   vars.ARTIFACT_BUCKET       실행 구성(compose, Alloy·모니터링 설정)을 올릴 S3 버킷
#   vars.ASG_NAME              Spring 애플리케이션 Auto Scaling Group 이름
#   vars.SSM_PREFIX            예: /attraction-reservation/prod

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 커밋 SHA(40자). 비우면 main의 최신 커밋을 배포한다.'
        required: false
        type: string

# 배포는 한 번에 하나만 실행하고, 진행 중인 배포를 취소하지 않는다.
# 대기 중인 실행도 취소하지 않고 순서대로 실행한다. (기본값 single은 새 실행이 들어오면 대기 중인 실행을 취소한다)
# 대기 실행의 순서는 보장되지 않지만, 각 실행이 시작할 때 main 최신 커밋인지 다시 확인하므로 최신 커밋만 배포된다.
concurrency:
  group: cd-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write   # AWS OIDC 인증

env:
  ARTIFACT_PREFIX: attraction-reservation

jobs:
  changes:
    name: Detect changes
    # CI는 PR에서도 실행되므로 main push에서 성공한 실행만 배포한다.
    # fork의 코드를 checkout하지 않도록 같은 저장소에서 실행된 CI만 허용한다.
    # 수동 실행은 main에서만 허용한다.
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      app: ${{ steps.detect.outputs.app }}
      monitoring: ${{ steps.detect.outputs.monitoring }}

    steps:
      # 입력값은 스크립트에 직접 넣지 않고 환경변수로 넘긴다.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          VERSION="${INPUT_VERSION:-${RUN_HEAD_SHA:-$CURRENT_SHA}}"
          if ! [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::버전은 40자 커밋 SHA여야 합니다: ${VERSION}"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 마지막 반영 버전과 비교하려면 전체 이력이 필요하다.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.version.outputs.value }}
          fetch-depth: 0
          persist-credentials: false

      # 수동 실행은 main에 머지된 커밋만 배포할 수 있다. (리뷰·CI를 거치지 않은 커밋 차단)
      - name: Verify version is on main
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! git merge-base --is-ancestor "$VERSION" origin/main; then
            echo "::error::main 이력에 없는 커밋은 배포할 수 없습니다: ${VERSION}"
            exit 1
          fi

      - name: Detect changes
        id: detect
        env:
          VERSION: ${{ steps.version.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
          APP_VERSION_PARAMETER: ${{ vars.SSM_PREFIX }}/APP_VERSION
          MONITORING_VERSION_PARAMETER: ${{ vars.SSM_PREFIX }}/MONITORING_VERSION
        run: |
          APP_BASE=$(aws ssm get-parameter --name "$APP_VERSION_PARAMETER" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)
          MONITORING_BASE=$(aws ssm get-parameter --name "$MONITORING_VERSION_PARAMETER" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)

          # base부터 VERSION까지 pathspec에 해당하는 변경이 있으면 성공(0)을 반환한다.
          # VERSION이 base와 같거나 base보다 오래된 커밋이면 변경이 없다고 본다. (늦게 끝난 CI가 배포를 되돌리지 않게 한다)
          # 그 밖에 base를 모르거나 VERSION의 조상이 아니면 비교할 수 없으므로 변경이 있다고 본다.
          has_changes() {
            local base="$1"; shift
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              return 0
            fi
            if git merge-base --is-ancestor "$VERSION" "$base" 2>/dev/null; then
              return 1
            fi
            if ! git merge-base --is-ancestor "$base" "$VERSION" 2>/dev/null; then
              return 0
            fi
            [ -n "$(git diff --name-only "$base" "$VERSION" -- "$@")" ]
          }

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$VERSION" != "$(git rev-parse origin/main)" ]; then
            # 자동 배포는 main의 최신 커밋만 한다. 늦게 끝나거나 재실행한 CI가 되돌린 변경을 배포하지 않게 한다.
            # 건너뛴 변경은 최신 커밋의 CD가 마지막 반영 버전부터 비교해 함께 배포한다.
            echo "::notice::main의 최신 커밋이 아니라 배포하지 않습니다: ${VERSION}"
            APP=false
            MONITORING=false
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 수동 실행은 롤백 용도라 앱만 지정한 버전으로 배포한다.
            APP=true
            MONITORING=false
          else
            APP=false
            MONITORING=false
            if has_changes "$APP_BASE" . ':(exclude)deploy/monitoring' ':(exclude)docs' ':(exclude).github' ':(glob,exclude)**/*.md'; then
              APP=true
            fi
            if has_changes "$MONITORING_BASE" deploy/monitoring; then
              MONITORING=true
            fi
          fi

          echo "app=${APP}" >> "$GITHUB_OUTPUT"
          echo "monitoring=${MONITORING}" >> "$GITHUB_OUTPUT"
          {
            echo "## 배포 대상"
            echo ""
            echo "| 대상 | 마지막 반영 버전 | 배포 |"
            echo "|---|---|---|"
            echo "| 앱 | \`${APP_BASE:--}\` | ${APP} |"
            echo "| 모니터링 | \`${MONITORING_BASE:--}\` | ${MONITORING} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-app:
    name: Deploy app
    needs: changes
    # changes가 이미 같은 저장소의 CI만 통과시키지만, checkout하는 job에서도 fork의 코드를 받지 않도록 다시 확인한다.
    if: >
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04-arm   # 운영 인스턴스(t4g)와 같은 arm64에서 이미지를 빌드한다
    environment: production
    timeout-minutes: 90   # 빌드 + 진행 중인 교체 대기(최대 30분) + 교체(최대 30분) + 롤백 대기(최대 10분)

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      ASG_NAME: ${{ vars.ASG_NAME }}
      VERSION: ${{ needs.changes.outputs.version }}
      BUNDLE_PREFIX: attraction-reservation/${{ needs.changes.outputs.version }}
      VERSION_PARAMETER: ${{ vars.SSM_PREFIX }}/APP_VERSION
      INSTANCE_WARMUP_SECONDS: 120     # 기동 후 ALB readiness 통과까지 걸리는 시간보다 길게 둔다
      REFRESH_TIMEOUT_SECONDS: 1800    # 이 시간 안에 교체가 끝나지 않으면 롤백한다
      REFRESH_POLL_SECONDS: 30

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 1) 같은 버전의 이미지·실행 구성이 이미 있으면(롤백·재배포) 다시 만들지 않는다.
      #    compose.yml은 마지막에 올리므로 있으면 실행 구성 전체가 올라간 것으로 본다.
      - name: Check artifact
        id: artifact
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$VERSION" > /dev/null 2>&1; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" \
            --key "${BUNDLE_PREFIX}/compose.yml" > /dev/null 2>&1; then
            echo "bundle_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.artifact.outputs.image_exists == 'false' || steps.artifact.outputs.bundle_exists == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      - name: Set up JDK 17
        if: steps.artifact.outputs.image_exists == 'false'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        if: steps.artifact.outputs.image_exists == 'false'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1

      # 테스트는 CI에서 통과한 커밋이므로 실행 가능한 jar만 만든다.
      - name: Build jar
        if: steps.artifact.outputs.image_exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Log in to ECR
        id: ecr
        if: steps.artifact.outputs.image_exists == 'false'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        if: steps.artifact.outputs.image_exists == 'false'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.VERSION }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "::error::build/libs에서 실행 가능한 jar를 찾지 못했습니다."
            exit 1
          fi
          docker build --platform linux/arm64 -f Dockerfile --build-arg JAR_FILE="$(basename "$JAR")" -t "$IMAGE" build/libs
          docker push "$IMAGE"

      # 모니터링 구성은 deploy-monitoring이 따로 올린다.
      # compose.yml을 마지막에 올려 Check artifact가 일부만 올라간 상태를 완료로 보지 않게 한다.
      - name: Upload deploy bundle to S3
        if: steps.artifact.outputs.bundle_exists == 'false'
        run: |
          aws s3 cp --recursive deploy "s3://${ARTIFACT_BUCKET}/${BUNDLE_PREFIX}/" \
            --exclude compose.yml --exclude 'monitoring/*'
          aws s3 cp deploy/compose.yml "s3://${ARTIFACT_BUCKET}/${BUNDLE_PREFIX}/compose.yml"

      # 이전 실행이 시작한 롤백 교체 등이 진행 중이면 끝날 때까지 기다린다.
      # 진행 중에 APP_VERSION을 바꾸면 그 교체가 띄우는 인스턴스가 새 버전으로 기동한다.
      # 시간 안에 끝나지 않으면 APP_VERSION을 바꾸기 전에 실패한다.
      - name: Wait for active instance refresh
        run: |
          DEADLINE=$(( $(date +%s) + REFRESH_TIMEOUT_SECONDS ))
          while :; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" --max-records 1 \
              --query 'InstanceRefreshes[0].Status' --output text)
            case "$STATUS" in
              Pending|InProgress|Cancelling|Baking|RollbackInProgress) ;;
              *) exit 0 ;;
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::진행 중인 Instance refresh가 ${REFRESH_TIMEOUT_SECONDS}초 안에 끝나지 않았습니다: ${STATUS}"
              exit 1
            fi
            echo "진행 중인 Instance refresh를 기다립니다: ${STATUS}"
            sleep "$REFRESH_POLL_SECONDS"
          done

      # 2) 버전 교체: 롤백에 쓸 이전 버전을 먼저 기록한다.
      - name: Update APP_VERSION
        id: param
        run: |
          PREVIOUS=$(aws ssm get-parameter --name "$VERSION_PARAMETER" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          aws ssm put-parameter --name "$VERSION_PARAMETER" --value "$VERSION" \
            --type String --overwrite > /dev/null
          echo "APP_VERSION: ${PREVIOUS:-없음} -> ${VERSION}"

      # 3) 새 인스턴스를 먼저 띄우고(최대 200%) 정상이 되면 기존 인스턴스를 내린다.
      #    가용 용량이 100% 아래로 내려가지 않는다.
      - name: Start instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences "{\"MinHealthyPercentage\":100,\"MaxHealthyPercentage\":200,\"InstanceWarmup\":${INSTANCE_WARMUP_SECONDS}}" \
            --query 'InstanceRefreshId' --output text)
          echo "id=${REFRESH_ID}" >> "$GITHUB_OUTPUT"
          echo "InstanceRefreshId: ${REFRESH_ID}"

      - name: Wait for instance refresh
        env:
          REFRESH_ID: ${{ steps.refresh.outputs.id }}
        run: |
          DEADLINE=$(( $(date +%s) + REFRESH_TIMEOUT_SECONDS ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            read -r STATUS PERCENT < <(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)
            echo "status=${STATUS} percentage=${PERCENT}"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|Cancelling|RollbackInProgress|RollbackFailed|RollbackSuccessful)
                echo "::error::Instance refresh가 ${STATUS} 상태로 끝났습니다."
                exit 1 ;;
              *) ;;   # Pending, InProgress 등은 계속 기다린다
            esac
            sleep "$REFRESH_POLL_SECONDS"
          done
          echo "::error::Instance refresh가 ${REFRESH_TIMEOUT_SECONDS}초 안에 끝나지 않았습니다."
          exit 1

      # 4) 실패하면 APP_VERSION을 이전 값으로 되돌리고 이전 버전으로 다시 교체한다.
      #    롤백 교체의 완료 여부는 ASG 콘솔에서 확인한다. 이 job은 실패로 끝난다.
      #    실행을 직접 취소하면 롤백하지 않는다. APP_VERSION은 새 버전으로 남고 시작한 교체는 계속 진행된다.
      - name: Roll back
        if: failure() && steps.param.outcome == 'success'
        env:
          PREVIOUS: ${{ steps.param.outputs.previous }}
          REFRESH_ID: ${{ steps.refresh.outputs.id }}
        run: |
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "None" ]; then
            echo "::error::이전 APP_VERSION이 없어 자동 롤백하지 않습니다."
            exit 1
          fi

          if [ -n "$REFRESH_ID" ]; then
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$ASG_NAME" > /dev/null 2>&1 || true
            # 취소가 끝나야 새 교체를 시작할 수 있다.
            for _ in $(seq 1 60); do
              STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG_NAME" --instance-refresh-ids "$REFRESH_ID" \
                --query 'InstanceRefreshes[0].Status' --output text)
              case "$STATUS" in
                Pending|InProgress|Cancelling|Baking|RollbackInProgress) sleep 10 ;;
                *) break ;;
              esac
            done
          fi

          aws ssm put-parameter --name "$VERSION_PARAMETER" --value "$PREVIOUS" \
            --type String --overwrite > /dev/null
          ROLLBACK_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences "{\"MinHealthyPercentage\":100,\"MaxHealthyPercentage\":200,\"InstanceWarmup\":${INSTANCE_WARMUP_SECONDS}}" \
            --query 'InstanceRefreshId' --output text)
          echo "::warning::APP_VERSION을 ${PREVIOUS}로 되돌리고 롤백 교체를 시작했습니다. InstanceRefreshId=${ROLLBACK_ID}"

      - name: Deployment summary
        if: always()
        env:
          PREVIOUS: ${{ steps.param.outputs.previous }}
          REFRESH_ID: ${{ steps.refresh.outputs.id }}
          BUILT: ${{ steps.artifact.outputs.image_exists == 'false' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🚀 앱 배포 결과: ${JOB_STATUS}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 배포 버전 | \`${VERSION:--}\` |"
            echo "| 이전 버전 | \`${PREVIOUS:--}\` |"
            echo "| 이미지 새로 빌드 | ${BUILT} |"
            echo "| Auto Scaling Group | \`${ASG_NAME}\` |"
            echo "| InstanceRefreshId | \`${REFRESH_ID:--}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-monitoring:
    name: Deploy monitoring
    needs: changes
    # changes가 이미 같은 저장소의 CI만 통과시키지만, checkout하는 job에서도 fork의 코드를 받지 않도록 다시 확인한다.
    if: >
      needs.changes.outputs.monitoring == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      VERSION: ${{ needs.changes.outputs.version }}
      VERSION_PARAMETER: ${{ vars.SSM_PREFIX }}/MONITORING_VERSION
      MONITORING_INSTANCE_NAME: attraction-reservation-monitoring   # 모니터링 인스턴스의 Name 태그
      COMMAND_TIMEOUT_SECONDS: 600

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false

      # 1) 버전마다 다른 경로에 올리므로 같은 버전을 다시 올려도 덮어쓸 뿐이다.
      - name: Upload monitoring bundle to S3
        run: |
          aws s3 cp --recursive deploy/monitoring \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/monitoring/${VERSION}/"

      # 2) 실패 시 되돌릴 이전 버전을 먼저 기록한다.
      - name: Update MONITORING_VERSION
        id: param
        run: |
          PREVIOUS=$(aws ssm get-parameter --name "$VERSION_PARAMETER" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)
          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          aws ssm put-parameter --name "$VERSION_PARAMETER" --value "$VERSION" \
            --type String --overwrite > /dev/null
          echo "MONITORING_VERSION: ${PREVIOUS:-없음} -> ${VERSION}"

      # 3) 인스턴스가 새 구성을 받아 컨테이너를 갱신한다. .env(Grafana 비밀번호)와 /data는 그대로 둔다.
      #    compose.yml이 그대로면 up -d는 컨테이너를 다시 만들지 않으므로, 마운트한 설정 파일
      #    (prometheus.yml, loki-config.yml, Grafana provisioning)을 읽도록 세 서비스를 재시작한다.
      #    재시작하는 동안 앱 인스턴스의 Alloy가 전송을 재시도하므로 로그·메트릭은 빠지지 않는다.
      - name: Apply on monitoring instance
        id: apply
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${MONITORING_INSTANCE_NAME}" Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ "$(echo "$INSTANCE_IDS" | wc -w)" -ne 1 ]; then
            echo "::error::실행 중인 모니터링 인스턴스가 하나가 아닙니다: '${INSTANCE_IDS}'"
            exit 1
          fi
          INSTANCE_ID="$INSTANCE_IDS"

          SCRIPT=$(cat <<EOF
          set -euo pipefail
          export AWS_DEFAULT_REGION=${AWS_REGION}
          cd /opt/monitoring
          aws s3 sync --delete --exclude .env "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/monitoring/${VERSION}/" .
          docker compose up -d
          docker compose restart prometheus loki grafana
          echo "monitoring updated to ${VERSION}"
          EOF
          )
          PARAMETERS=$(jq -n --arg script "$SCRIPT" --arg timeout "$COMMAND_TIMEOUT_SECONDS" \
            '{commands: [$script], executionTimeout: [$timeout]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "monitoring ${VERSION:0:7}" \
            --parameters "$PARAMETERS" --query 'Command.CommandId' --output text)
          echo "CommandId: ${COMMAND_ID}"

          DEADLINE=$(( $(date +%s) + COMMAND_TIMEOUT_SECONDS + 60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
            esac
            break
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "::error::모니터링 갱신 명령이 ${STATUS} 상태로 끝났습니다."
            exit 1
          fi

      # 4) 실패하면 MONITORING_VERSION을 되돌려 다음 배포에서 같은 변경을 다시 감지하게 한다.
      #    이전 값이 없으면 비교할 수 없는 값(none)으로 두어 다음 배포에서 전체를 반영하게 한다.
      - name: Roll back MONITORING_VERSION
        if: failure() && steps.param.outcome == 'success'
        env:
          PREVIOUS: ${{ steps.param.outputs.previous }}
        run: |
          VALUE="$PREVIOUS"
          if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
            VALUE=none
          fi
          aws ssm put-parameter --name "$VERSION_PARAMETER" --value "$VALUE" \
            --type String --overwrite > /dev/null
          echo "::warning::MONITORING_VERSION을 ${VALUE}로 되돌렸습니다."

      - name: Deployment summary
        if: always()
        env:
          PREVIOUS: ${{ steps.param.outputs.previous }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 📈 모니터링 배포 결과: ${JOB_STATUS}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 배포 버전 | \`${VERSION:--}\` |"
            echo "| 이전 버전 | \`${PREVIOUS:--}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
