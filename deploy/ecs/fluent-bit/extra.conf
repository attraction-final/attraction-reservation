# FireLens가 만든 기본 설정(forward 입력) 뒤에 붙는 사용자 설정.
# app 컨테이너 stdout(logfmt)만 Loki로 보낸다. 로그 형식은 docs/logging/logging.md 참고
#
# FireLens는 app 컨테이너 로그에 "app-firelens-<task ID>" 태그를 붙인다.
# 로그 레이블은 값 종류가 적은 app, env, service(api·worker)만 붙인다. 나머지 값은 조회할 때 | logfmt로 꺼낸다.

[SERVICE]
    parsers_file /fluent-bit/etc/app-parsers.conf

# 스택 트레이스가 한 로그로 묶이도록 ts=로 시작하는 줄을 새 로그의 시작으로 본다.
[FILTER]
    name                  multiline
    match                 app-firelens-*
    multiline.key_content log
    multiline.parser      app_logfmt
    buffer                on
    flush_ms              3000

# FireLens가 붙이는 컨테이너 정보를 지우고 log 값(logfmt 한 줄)만 그대로 보낸다.
[OUTPUT]
    name            loki
    match           app-firelens-*
    host            ${LOKI_HOST}
    port            ${LOKI_PORT}
    labels          app=attraction-reservation, env=${APP_ENV}, service=${SERVICE}
    remove_keys     container_id, container_name, source
    drop_single_key raw
    line_format     key_value
