spring:
  datasource:
    url: jdbc:h2:mem:attraction_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# 테스트 환경에서만 사용하는 JWT 설정
jwt:
  # 32바이트 테스트 전용 키를 Base64로 인코딩한 값
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiration: 600000
  refresh-token-expiration: 604800000

# 테스트에서는 자동 실행을 끄고 테스트 코드가 취소 서비스를 직접 호출한다.
order:
  cancel:
    scheduler:
      enabled: false